<div id="admin-card" data-admin="preview" class="a-wrap">
  <div class="a-body">

    <div class="a-content">
      <div data-card="fullName" class="a-title">{NAME}</div>
      <div data-card="email" class="a-description">{EMAIL}</div>
      <div data-card="boardName" class="a-mark">{BOADRNAME}</div>
    </div>

    <div class="a-actions">
      <div data-card="linkTodo">
          <a href="{LINK}" class="b-button b-button_bordered b-button_sm a-link js-ingest">Open Board</a>
      </div>
      <div data-card="linkDocs">
          <a href="{LINK}" class="b-button b-button_sm a-link js-ingest">Open Docs</a>
      </div>
    </div>

  </div>
</div>
